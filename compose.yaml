services:
  db:
    image: postgres:16-alpine
    container_name: birge_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: birge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    container_name: birge_bot
    restart: always
    depends_on:
      - db
    ports:
      - "5000:8080" # <-- ПРОБРАСЫВАЕМ ПОРТ: 5000 на сервере -> 8080 в контейнере
    environment:
      - ASPNETCORE_URLS=http://+:8080 # <-- Говорим .NET слушать 8080
      - Discord__Token=${DISCORD_TOKEN}
      - Discord__GuildId=${DISCORD_GUILD_ID}
      - Discord__ClientRoleId=${DISCORD_CLIENT_ROLE_ID}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=birge_db;Username=postgres;Password=${DB_PASSWORD}
      - Epusdt__ApiToken=${EPUSDT_API_TOKEN}
      - Epusdt__ApiUrl=http://94.183.190.169:8080
      - Discord__OrdersChannelId=${DISCORD_ORDERS_CHANNEL_ID}
volumes:
  postgres_data:
